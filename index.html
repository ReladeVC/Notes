<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Notes — защищённый блокнот</title>
<link rel="icon" type="image/x-icon" href="icon.ico">
<link rel="icon" type="image/png" href="icon.png" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-0: #050505;
  --bg-1: #0a0a0b;
  --bg-2: #111113;
  --bg-3: #17171a;
  --bg-4: #1e1e22;
  --surface-1: rgba(255,255,255,0.035);
  --surface-2: rgba(255,255,255,0.06);
  --surface-3: rgba(255,255,255,0.09);
  --surface-hover: rgba(255,255,255,0.12);
  --border-0: rgba(255,255,255,0.05);
  --border-1: rgba(255,255,255,0.09);
  --border-2: rgba(255,255,255,0.14);
  --border-3: rgba(255,255,255,0.2);
  --text-0: #fafafa;
  --text-1: #e5e5e5;
  --text-2: #a1a1a1;
  --text-3: #737373;
  --text-4: #525252;
  --accent: #0a84ff;
  --accent-deep: #0055d4;
  --accent-glow: rgba(10,132,255,0.35);
  --accent-soft: rgba(10,132,255,0.14);
  --violet: #8b5cf6;
  --emerald: #10b981;
  --amber: #f59e0b;
  --rose: #f43f5e;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.35);
  --shadow-glow: 0 0 20px var(--accent-glow);
  --font: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono: 'JetBrains Mono',monospace;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  font-family: var(--font);
  color: var(--text-0);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.011em;
  font-feature-settings: 'cv11','ss01';
}

/* ===== Background layers ===== */
#meshCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  filter: blur(18px);
  opacity: .75;
  transform: translateZ(0);
  will-change: auto;
  contain: strict;
}

.bg-vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.5) 100%);
  pointer-events: none;
  z-index: 0;
}

.bg-noise {
  position: fixed;
  inset: 0;
  opacity: .035;
  mix-blend-mode: overlay;
  pointer-events: none;
  z-index: 0;
  background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAABERERmZmczMzOZmZkH9y36AAAACHRSTlMAMwAozSF3cX2l3v0AAABgSURBVDjLY2AYBaNgFIwCdAByUhJABpOTk4MgcXFxEQgxJycnAyEwOZmBgYGBQYoBDBgZGRhEGMCAiYmBQYQBDDg4GBiEGMAiDAwMjIwMDGxsDAxMTAwMjIwMDMzMDAxMzEA1TAxAwMYMAuwcDHBABEYhAwNCAABzUxFH3wG2XgAAAABJRU5ErkJggg==");
  background-repeat: repeat;
  contain: strict;
}

/* ===== App layout ===== */
.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* ===== Navbar ===== */
.navbar {
  background: rgba(10,10,11,.72);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border-1);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: fit-content;
}

.logo-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  box-shadow: 0 2px 12px var(--accent-glow);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.logo-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.logo h1 {
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(180deg, #fff 0%, #c4c4c4 100%);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: -.02em;
  line-height: 1;
}

.logo p {
  font-size: 9.5px;
  font-family: var(--mono);
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  line-height: 1;
}

.logo p::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 6px var(--emerald);
  animation: pulseDot 2.5s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ===== Auth ===== */
.auth {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 5px;
  border-radius: var(--radius-xl);
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  flex-wrap: wrap;
}

.auth input {
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  font-size: 12.5px;
  font-family: inherit;
  color: var(--text-0);
  width: 140px;
  transition: all .2s var(--ease-out);
}

.auth input::placeholder { color: var(--text-4); }

.auth input:focus {
  border-color: var(--accent);
  background: var(--bg-4);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.nav-spacer { flex: 1; }

/* ===== Buttons ===== */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .2s var(--ease-out);
  white-space: nowrap;
  overflow: hidden;
  isolation: isolate;
  --mx: 50%;
  --my: 50%;
}

.btn-primary {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
  color: #fff;
  border-color: rgba(255,255,255,.12);
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 2px 8px var(--accent-glow);
  font-weight: 600;
}

.btn-primary:hover {
  box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 16px var(--accent-glow);
  transform: translateY(-1px);
}

.btn-primary:active { transform: translateY(0); }

.btn-ghost {
  background: var(--surface-1);
  color: var(--text-1);
  border-color: var(--border-1);
}

.btn-ghost:hover {
  background: var(--surface-2);
  border-color: var(--border-2);
  color: var(--text-0);
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle 80px at var(--mx) var(--my), rgba(255,255,255,.15), transparent 70%);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
  z-index: -1;
  border-radius: inherit;
}

.btn:hover::after { opacity: 1; }

.btn .kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 5px;
  background: rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 4px;
  color: var(--text-2);
  letter-spacing: .02em;
}

/* ===== Language button ===== */
.lang-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  color: var(--text-1);
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s var(--ease-out);
}

.lang-btn:hover {
  background: var(--surface-2);
  border-color: var(--border-2);
}

.lang-flag {
  font-size: 14px;
  transition: transform .3s var(--ease-spring);
}

.lang-btn:hover .lang-flag {
  transform: rotate(-12deg) scale(1.1);
}

.lang-text {
  font-family: var(--mono);
  letter-spacing: .08em;
  font-size: 10.5px;
}

/* ===== Badge ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--mono);
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  color: var(--text-2);
  letter-spacing: .02em;
  transition: all .25s var(--ease-out);
}

.badge.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 16px var(--accent-soft);
}

.badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-4);
}

.badge.active .dot {
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

/* ===== Main layout ===== */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  gap: 1px;
  background: var(--border-0);
  position: relative;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 340px;
  background: rgba(10,10,11,.55);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border-0);
}

.search-box {
  position: relative;
  margin-bottom: 8px;
}

.search-box input {
  width: 100%;
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-sm);
  padding: 8px 60px 8px 34px;
  font-size: 12.5px;
  font-family: inherit;
  color: var(--text-0);
  transition: all .2s var(--ease-out);
}

.search-box input::placeholder { color: var(--text-4); }

.search-box input:focus {
  border-color: var(--accent);
  background: var(--bg-3);
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-3);
  pointer-events: none;
}

.search-kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 9.5px;
  padding: 2px 6px;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 3px;
  color: var(--text-3);
  pointer-events: none;
  white-space: nowrap;
}

/* ===== Messages ===== */
.msg-area {
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 500;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  transition: all .25s var(--ease-out);
  margin-bottom: 6px;
  opacity: 0;
  transform: translateY(-3px);
}

.msg-area.show {
  opacity: 1;
  transform: translateY(0);
}

.msg-area.success {
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.2);
  color: var(--emerald);
}

.msg-area.error {
  background: rgba(244,63,94,.1);
  border: 1px solid rgba(244,63,94,.2);
  color: var(--rose);
}

.msg-area.info {
  background: var(--accent-soft);
  border: 1px solid rgba(10,132,255,.2);
  color: var(--accent);
}

/* ===== Notes header ===== */
.notes-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px;
}

.notes-header h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .08em;
}

.notes-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-4);
  padding: 2px 7px;
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  border-radius: 100px;
}

.new-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, var(--violet) 100%);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all .25s var(--ease-spring);
  box-shadow: 0 2px 8px var(--accent-glow);
  position: relative;
  overflow: hidden;
  border: none;
}

.new-btn::after {
  content: '+';
  color: #fff;
  font-size: 18px;
  font-weight: 300;
  transition: transform .3s var(--ease-spring);
  line-height: 1;
}

.new-btn:hover {
  box-shadow: 0 4px 16px var(--accent-glow);
  transform: scale(1.06);
}

.new-btn:hover::after { transform: rotate(90deg); }
.new-btn:active { transform: scale(.94); }

/* ===== Notes list ===== */
.notes-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 10px 16px;
  contain: layout style paint;
}

.notes-list::-webkit-scrollbar { width: 6px; }
.notes-list::-webkit-scrollbar-track { background: transparent; }
.notes-list::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 3px; }
.notes-list::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

.note-item {
  position: relative;
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  border-radius: var(--radius-md);
  padding: 12px 12px 10px 14px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .2s var(--ease-out), border-color .2s var(--ease-out), transform .3s var(--ease-out);
  overflow: hidden;
  --mx: 50%;
  --my: 50%;
  will-change: auto;
}

.note-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, var(--accent), var(--violet));
  opacity: 0;
  transform: translateX(-6px);
  transition: all .25s var(--ease-out);
}

.note-item::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle 120px at var(--mx) var(--my), rgba(10,132,255,.12), transparent 70%);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
}

.note-item:hover {
  background: var(--surface-2);
  border-color: var(--border-1);
}

.note-item:hover::before { opacity: .6; transform: translateX(0); }
.note-item:hover::after { opacity: 1; }

.note-item.active {
  background: var(--surface-2);
  border-color: var(--border-2);
  box-shadow: 0 4px 12px rgba(0,0,0,.2), inset 0 0 0 1px rgba(10,132,255,.08);
}

.note-item.active::before { opacity: 1; transform: translateX(0); }

.note-item.flipping { will-change: transform; }

.note-item.fade-in {
  animation: noteFadeIn .3s var(--ease-out);
}

@keyframes noteFadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.note-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-0);
  margin-bottom: 3px;
  line-height: 1.4;
  letter-spacing: -.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-preview {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 1em;
}

.note-date {
  font-size: 10px;
  color: var(--text-4);
  font-family: var(--mono);
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 5px;
}

.note-date::before {
  content: '';
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-4);
}

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-3);
  font-size: 12.5px;
}

.empty-state .emoji {
  font-size: 36px;
  margin-bottom: 10px;
  display: block;
  opacity: .4;
  filter: grayscale(.3);
}

/* ===== Editor ===== */
.editor {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: rgba(10,10,11,.4);
  overflow: hidden;
  position: relative;
  min-width: 0;
}

.editor-toolbar {
  padding: 14px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid var(--border-0);
  background: rgba(10,10,11,.5);
  z-index: 2;
  flex-shrink: 0;
}

.title-input {
  font-size: 24px;
  font-weight: 700;
  background: transparent;
  border: none;
  color: var(--text-0);
  flex: 1;
  outline: none;
  letter-spacing: -.025em;
  font-family: inherit;
  caret-color: var(--accent);
  min-width: 0;
}

.title-input::placeholder {
  color: var(--text-4);
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid var(--border-1);
  background: var(--surface-1);
  color: var(--text-1);
  transition: all .2s var(--ease-out);
  position: relative;
  overflow: hidden;
  --mx: 50%;
  --my: 50%;
}

.icon-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle 60px at var(--mx) var(--my), rgba(255,255,255,.1), transparent 70%);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
  border-radius: inherit;
}

.icon-btn:hover::after { opacity: 1; }

.icon-btn:hover {
  background: var(--surface-2);
  border-color: var(--border-2);
  color: var(--text-0);
}

.icon-btn.emoji {
  background: rgba(245,158,11,.08);
  border-color: rgba(245,158,11,.18);
  color: var(--amber);
}

.icon-btn.emoji:hover {
  background: rgba(245,158,11,.14);
  border-color: rgba(245,158,11,.3);
}

.icon-btn.mode {
  background: var(--surface-2);
  border-color: var(--border-2);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .02em;
}

.icon-btn.save {
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
  border-color: rgba(255,255,255,.12);
  color: #fff;
  box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 2px 8px var(--accent-glow);
  font-weight: 600;
}

.icon-btn.save:hover {
  box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 16px var(--accent-glow);
  transform: translateY(-1px);
}

.icon-btn.save::after {
  background: radial-gradient(circle 60px at var(--mx) var(--my), rgba(255,255,255,.25), transparent 70%);
}

.icon-btn.danger {
  background: rgba(244,63,94,.06);
  border-color: rgba(244,63,94,.18);
  color: var(--rose);
}

.icon-btn.danger:hover {
  background: rgba(244,63,94,.12);
  border-color: rgba(244,63,94,.28);
}

/* ===== Content area ===== */
.content-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

textarea, .viewer {
  position: absolute;
  inset: 0;
  padding: 28px 40px 80px;
  font-size: 15px;
  line-height: 1.7;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-1);
  overflow-y: auto;
  font-family: inherit;
  resize: none;
  caret-color: var(--accent);
  letter-spacing: -.003em;
}

textarea::placeholder { color: var(--text-4); }

textarea::-webkit-scrollbar, .viewer::-webkit-scrollbar { width: 8px; }
textarea::-webkit-scrollbar-track, .viewer::-webkit-scrollbar-track { background: transparent; }
textarea::-webkit-scrollbar-thumb, .viewer::-webkit-scrollbar-thumb {
  background: var(--border-1);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
textarea::-webkit-scrollbar-thumb:hover, .viewer::-webkit-scrollbar-thumb:hover {
  background: var(--border-2);
  background-clip: padding-box;
}

/* ===== Markdown viewer ===== */
.viewer h1 {
  font-size: 28px;
  font-weight: 800;
  margin: 28px 0 14px;
  background: linear-gradient(180deg, #fff 0%, #a1a1a1 100%);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  letter-spacing: -.03em;
  line-height: 1.2;
}

.viewer h1:first-child { margin-top: 0; }

.viewer h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 24px 0 10px;
  color: var(--text-0);
  letter-spacing: -.025em;
}

.viewer h3 {
  font-size: 17px;
  font-weight: 600;
  margin: 20px 0 8px;
  color: var(--text-0);
}

.viewer p { margin: 10px 0; }

.viewer strong {
  color: var(--text-0);
  font-weight: 700;
}

.viewer a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-soft);
  transition: all .2s ease;
}

.viewer a:hover {
  border-bottom-color: var(--accent);
  text-shadow: 0 0 12px var(--accent-glow);
}

.viewer ul {
  margin: 10px 0;
  padding-left: 22px;
  list-style: none;
}

.viewer li {
  position: relative;
  margin: 6px 0;
  padding-left: 4px;
}

.viewer li::before {
  content: '';
  position: absolute;
  left: -14px;
  top: 9px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 4px var(--accent-glow);
}

/* ===== Status bar ===== */
.bottom-status {
  padding: 8px 28px;
  font-size: 10.5px;
  font-family: var(--mono);
  color: var(--text-3);
  border-top: 1px solid var(--border-0);
  background: rgba(10,10,11,.6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  letter-spacing: .02em;
  flex-shrink: 0;
}

.status-left, .status-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bottom-status .status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-4);
  transition: all .25s ease;
}

.bottom-status.saving .status-dot {
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
  animation: pulseDot 1s ease-in-out infinite;
}

.bottom-status.saved .status-dot {
  background: var(--emerald);
  box-shadow: 0 0 6px var(--emerald);
}

.bottom-status.error .status-dot {
  background: var(--rose);
  box-shadow: 0 0 6px var(--rose);
}

.shortcut-hint {
  display: inline-flex;
  gap: 8px;
  color: var(--text-4);
  align-items: center;
}

.shortcut-hint span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.shortcut-hint kbd {
  font-family: var(--mono);
  font-size: 9.5px;
  padding: 1px 5px;
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  border-radius: 3px;
  color: var(--text-3);
}

/* ===== Emoji picker ===== */
.emoji-picker {
  position: fixed;
  background: rgba(23,23,26,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
  padding: 10px;
  display: none;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
  max-width: 340px;
  z-index: 1000;
  border: 1px solid var(--border-2);
  box-shadow: 0 20px 48px rgba(0,0,0,.6);
}

.emoji-picker.show {
  display: grid;
  animation: emojiAppear .2s var(--ease-spring);
}

@keyframes emojiAppear {
  from { opacity: 0; transform: translateY(-6px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.emoji-item {
  font-size: 20px;
  cursor: pointer;
  text-align: center;
  padding: 6px;
  border-radius: var(--radius-sm);
  transition: all .12s var(--ease-spring);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}

.emoji-item:hover {
  background: var(--surface-3);
  transform: scale(1.2);
}

/* ===== Command palette ===== */
.cmd-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 15vh;
  animation: fadeIn .15s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.cmd-palette {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  width: 560px;
  max-width: calc(100vw - 40px);
  max-height: 70vh;
  box-shadow: 0 24px 64px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
  overflow: hidden;
  animation: paletteAppear .2s var(--ease-out);
  display: flex;
  flex-direction: column;
}

@keyframes paletteAppear {
  from { opacity: 0; transform: translateY(-10px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.cmd-input-wrap {
  position: relative;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-0);
  display: flex;
  align-items: center;
  gap: 10px;
}

.cmd-input-wrap svg {
  width: 16px;
  height: 16px;
  color: var(--text-3);
  flex-shrink: 0;
}

.cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-0);
  font-size: 14px;
  font-family: inherit;
  caret-color: var(--accent);
}

.cmd-input::placeholder { color: var(--text-4); }

.cmd-shortcut-hint {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 4px;
  color: var(--text-3);
}

.cmd-results {
  overflow-y: auto;
  padding: 6px;
  flex: 1;
  max-height: 50vh;
}

.cmd-results::-webkit-scrollbar { width: 6px; }
.cmd-results::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 3px; }

.cmd-group-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-4);
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 8px 10px 4px;
  font-family: var(--mono);
}

.cmd-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .12s ease;
  color: var(--text-1);
}

.cmd-item.active, .cmd-item:hover { background: var(--surface-2); }

.cmd-item-icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: 14px;
  background: var(--surface-1);
  border: 1px solid var(--border-0);
  border-radius: 6px;
  flex-shrink: 0;
}

.cmd-item-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.cmd-item-title {
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cmd-item-subtitle {
  font-size: 10.5px;
  color: var(--text-3);
  margin-top: 1px;
}

.cmd-item kbd {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 4px;
  color: var(--text-3);
  letter-spacing: .02em;
  white-space: nowrap;
}

.cmd-footer {
  padding: 8px 14px;
  border-top: 1px solid var(--border-0);
  display: flex;
  gap: 16px;
  font-size: 10.5px;
  color: var(--text-3);
  font-family: var(--mono);
  background: rgba(0,0,0,.2);
}

.cmd-footer-hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.cmd-footer-hint kbd {
  padding: 1px 5px;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 3px;
  font-size: 10px;
}

.cmd-empty {
  padding: 30px 20px;
  text-align: center;
  color: var(--text-3);
  font-size: 12.5px;
}

/* ===== Help overlay ===== */
.help-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 1500;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn .2s ease;
}

.help-overlay.show { display: flex; }

.help-modal {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  width: 480px;
  max-width: calc(100vw - 40px);
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,.7);
  animation: dialogAppear .3s var(--ease-out);
}

.help-modal h4 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text-0);
  letter-spacing: -.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.help-modal h4::before { content: '\2328'; font-size: 18px; }

.help-section { margin-bottom: 16px; }

.help-section-title {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
  font-family: var(--mono);
}

.help-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 12.5px;
}

.help-row-label { color: var(--text-1); }

.help-row-keys {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}

.help-row kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 2px 6px;
  background: var(--surface-1);
  border: 1px solid var(--border-1);
  border-radius: 4px;
  color: var(--text-1);
  min-width: 20px;
  text-align: center;
}

.help-row kbd.plus {
  background: transparent;
  border: none;
  color: var(--text-4);
  min-width: auto;
  padding: 0 2px;
}

/* ===== Dialog ===== */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
}

.dialog-overlay.show {
  display: flex;
  animation: fadeIn .15s ease;
}

.dialog {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius-xl);
  padding: 24px;
  max-width: 380px;
  width: calc(100% - 40px);
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
  animation: dialogAppear .25s var(--ease-out);
}

@keyframes dialogAppear {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dialog h4 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-0);
  letter-spacing: -.02em;
}

.dialog p {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  margin-bottom: 20px;
}

.dialog-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.dialog-actions .btn { padding: 8px 16px; }

.btn-danger {
  background: linear-gradient(180deg, var(--rose) 0%, #dc2626 100%);
  color: #fff;
  border-color: rgba(255,255,255,.1);
  box-shadow: 0 2px 8px rgba(244,63,94,.35);
}

.btn-danger:hover {
  box-shadow: 0 4px 16px rgba(244,63,94,.5);
  transform: translateY(-1px);
}

/* ===== Loading ring ===== */
.loading-ring {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid rgba(255,255,255,.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spinRing .7s linear infinite;
}

@keyframes spinRing { to { transform: rotate(360deg); } }

/* ===== Toast ===== */
.key-toast {
  position: fixed;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-3);
  color: var(--text-1);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 11px;
  border: 1px solid var(--border-2);
  box-shadow: var(--shadow-lg);
  animation: toastAnim 1.2s var(--ease-out);
  pointer-events: none;
  z-index: 3000;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

@keyframes toastAnim {
  0% { opacity: 0; transform: translate(-50%, 8px); }
  15%, 75% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -4px); }
}

/* ===== Particles ===== */
.particle {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  font-size: 18px;
  animation: particleBurst .8s var(--ease-out) forwards;
  will-change: transform, opacity;
}

@keyframes particleBurst {
  0% { transform: translate(0,0) scale(0); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--r)); opacity: 0; }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { width: 260px; }
  .auth input { width: 100px; }
  .navbar { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
  .title-input { font-size: 18px; }
  textarea, .viewer { padding: 18px 20px 60px; font-size: 14px; }
  .editor-toolbar { padding: 10px 16px; }
  .logo p { display: none; }
  .shortcut-hint { display: none; }
  .icon-btn span:not(.loading-ring) { display: none; }
  .icon-btn { padding: 7px 9px; }
}

@media (max-width: 480px) {
  .sidebar { width: 100%; position: absolute; z-index: 5; }
  .editor { width: 100%; }
}

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  #meshCanvas { filter: none; opacity: .4; }
  .bg-noise { opacity: .02; }
}
</style>

/* =================================================================
   OS DETECTION & KEYBOARD UTILITIES
   ================================================================= */
const isMac = /mac|iphone|ipad|ipod/i.test(navigator.platform || navigator.userAgent);
const modSymbol = isMac ? '\u2318' : 'Ctrl';
const shiftSymbol = isMac ? '\u21E7' : 'Shift';

function isMod(e) {
  return isMac ? e.metaKey : e.ctrlKey;
}

function formatShortcut(shortcut) {
  if (!shortcut) return '';
  const parts = shortcut.split('+');
  const result = [];
  let letter = '';
  for (const part of parts) {
    if (part === 'mod') result.push(modSymbol);
    else if (part === 'shift') result.push(shiftSymbol);
    else letter = part.toUpperCase();
  }
  return isMac ? result.join('') + letter : [...result, letter].join('+');
}

/* =================================================================
   MESH BACKGROUND
   ================================================================= */
var meshCanvas = document.getElementById('meshCanvas');
var meshCtx = meshCanvas.getContext('2d', { alpha: true, desynchronized: true });
var meshW, meshH, meshPoints = [], meshCols = 6, meshRows = 4, meshRAF = null, meshActive = true, lastFrameTime = 0;
var FPS_LIMIT = 24;
var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (prefersReducedMotion) meshActive = false;

function resizeMesh() {
  var sc = 0.25;
  meshW = meshCanvas.width = Math.max(100, Math.floor(window.innerWidth * sc));
  meshH = meshCanvas.height = Math.max(100, Math.floor(window.innerHeight * sc));
  meshCanvas.style.width = window.innerWidth + 'px';
  meshCanvas.style.height = window.innerHeight + 'px';
  initMeshPoints();
}

function initMeshPoints() {
  meshPoints = [];
  for (var y = 0; y < meshRows; y++) {
    for (var x = 0; x < meshCols; x++) {
      meshPoints.push({
        baseX: (x / (meshCols - 1)) * meshW,
        baseY: (y / (meshRows - 1)) * meshH,
        ox: Math.random() * Math.PI * 2,
        oy: Math.random() * Math.PI * 2,
        speed: 0.25 + Math.random() * 0.35,
        amplitude: 15 + Math.random() * 20,
        hue: 210 + Math.random() * 40
      });
    }
  }
}

function drawMesh(now) {
  if (!meshActive) return;
  if (now - lastFrameTime < 1000 / FPS_LIMIT) {
    meshRAF = requestAnimationFrame(drawMesh);
    return;
  }
  lastFrameTime = now;
  meshCtx.clearRect(0, 0, meshW, meshH);
  var tm = now * 0.0004;
  var len = meshPoints.length;

  for (var i = 0; i < len; i++) {
    var p = meshPoints[i];
    var x = p.baseX + Math.sin(tm * p.speed + p.ox) * p.amplitude;
    var y = p.baseY + Math.cos(tm * p.speed * 0.7 + p.oy) * p.amplitude;
    var r = 30;
    var g = meshCtx.createRadialGradient(x, y, 0, x, y, r);
    var h = p.hue + Math.sin(i * 0.5 + tm * 0.2) * 20;
    g.addColorStop(0, 'hsla(' + h + ',100%,55%,.22)');
    g.addColorStop(0.5, 'hsla(' + (h + 30) + ',80%,50%,.10)');
    g.addColorStop(1, 'transparent');
    meshCtx.fillStyle = g;
    meshCtx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  meshRAF = requestAnimationFrame(drawMesh);
}

window.addEventListener('resize', resizeMesh);
resizeMesh();
if (!prefersReducedMotion) meshRAF = requestAnimationFrame(drawMesh);

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    meshActive = false;
    if (meshRAF) cancelAnimationFrame(meshRAF);
  } else if (!prefersReducedMotion) {
    meshActive = true;
    lastFrameTime = 0;
    meshRAF = requestAnimationFrame(drawMesh);
  }
});

/* =================================================================
   CRYPTOGRAPHY
   ================================================================= */
async function deriveKey(pwd, salt) {
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey(
    'raw',
    enc.encode(pwd),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 210000, hash: 'SHA-256' },
    km,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptData(obj, pwd) {
  var plain = JSON.stringify(obj);
  var enc = new TextEncoder();
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var key = await deriveKey(pwd, salt);
  var encrypted = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    enc.encode(plain)
  );
  var combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
  combined.set(salt);
  combined.set(iv, salt.length);
  combined.set(new Uint8Array(encrypted), salt.length + iv.length);
  return btoa(String.fromCharCode.apply(null, combined));
}

async function decryptData(b64, pwd) {
  var data = Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
  var salt = data.slice(0, 16);
  var iv = data.slice(16, 28);
  var cipher = data.slice(28);
  var key = await deriveKey(pwd, salt);
  var dec = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    key,
    cipher
  );
  return JSON.parse(new TextDecoder().decode(dec));
}

/* =================================================================
   STORAGE ADAPTER (Tauri / Browser)
   ================================================================= */
var IS_TAURI = window.__TAURI__ !== undefined;
var tauriFs = null;
var tauriInvoke = null;
var cachedDataDir = null;

if (IS_TAURI) {
  tauriFs = window.__TAURI__.fs;
  tauriInvoke = window.__TAURI__.core.invoke;
}

var STORAGE_PREFIX = 'vc_notes_v4';
var CURRENT_VERSION = 2;

function getKey(uid) {
  return STORAGE_PREFIX + '_' + uid;
}

function getTempKey(uid) {
  return STORAGE_PREFIX + '_' + uid + '_temp';
}

async function getDataDir() {
  if (!IS_TAURI) return null;
  if (cachedDataDir) return cachedDataDir;
  try {
    cachedDataDir = await tauriInvoke('get_data_dir');
    return cachedDataDir;
  } catch (e) {
    console.error('Failed to get data dir:', e);
    return null;
  }
}

async function getStorageFilePath(uid) {
  var dd = await getDataDir();
  if (!dd) return null;
  return (dd + '\\' + uid + '.enc').replace(/\\\\/g, '\\');
}

var migrations = {
  0: function(d) { return Object.assign({}, d, { version: 1 }); },
  1: function(d) {
    return Object.assign({}, d, {
      version: 2,
      notes: Object.fromEntries(
        Object.entries(d.notes || {}).map(function(entry) {
          var id = entry[0];
          var n = entry[1];
          return [id, Object.assign({}, n, {
            tags: n.tags || [],
            pinned: n.pinned || false
          })];
        })
      )
    });
  }
};

function migrateData(data) {
  var cur = data;
  var ver = cur.version != null ? cur.version : 0;
  while (ver < CURRENT_VERSION) {
    var m = migrations[ver];
    if (!m) {
      console.error('MD Notes: no migration from v' + ver);
      break;
    }
    cur = m(cur);
    ver = cur.version;
  }
  return cur;
}

async function saveCollection(uid, pwd, data) {
  var vd = Object.assign({}, data, { version: CURRENT_VERSION });
  var enc = await encryptData(vd, pwd);

  if (IS_TAURI) {
    try {
      var fp = await getStorageFilePath(uid);
      if (!fp) throw new Error('Data directory not available');
      var tp = fp + '.tmp';
      await tauriFs.writeTextFile(tp, enc);
      await tauriFs.writeTextFile(fp, enc);
      try { await tauriFs.remove(tp); } catch (e) { /* ignore cleanup error */ }
    } catch (e) {
      console.error('Tauri FS write error:', e);
      throw e;
    }
  } else {
    var k = getKey(uid);
    var tk = getTempKey(uid);
    localStorage.setItem(tk, enc);
    localStorage.setItem(k, enc);
    localStorage.removeItem(tk);
  }
}

async function loadCollection(uid, pwd) {
  var raw = null;

  if (IS_TAURI) {
    try {
      var fp = await getStorageFilePath(uid);
      if (fp && await tauriFs.exists(fp)) {
        raw = await tauriFs.readTextFile(fp);
      } else if (fp) {
        var tp = fp + '.tmp';
        if (await tauriFs.exists(tp)) {
          raw = await tauriFs.readTextFile(tp);
          console.warn('MD Notes: restored from temp');
        }
      }
    } catch (e) {
      console.error('Tauri FS read error:', e);
    }
  } else {
    raw = localStorage.getItem(getKey(uid)) || localStorage.getItem(getTempKey(uid));
  }

  if (!raw) return { notes: {}, nextId: 1, version: CURRENT_VERSION };
  var dec = await decryptData(raw, pwd);
  return migrateData(dec);
}

/* =================================================================
   MARKDOWN RENDERER
   ================================================================= */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

function mdToHtml(text) {
  if (!text) return '';
  var h = escapeHtml(text);

  // Headings
  h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.*)$/gm, '<h1>$1</h1>');

  // Bold & italic
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  h = h.replace(/__(.+?)__/g, '<u>$1</u>');

  // Lists
  h = h.replace(/^- (.*)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*?<\/li>(\n|$))+/g, function(m) { return '<ul>' + m + '</ul>'; });

  // Links
  h = h.replace(/(\b(https?|ftp):\/\/[^\s<>]+|www\.[^\s<>]+)/gi, function(url) {
    var href = url.startsWith('www.') ? 'https://' + url : url;
    return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
  });

  h = h.replace(/\n/g, '<br>');
  return h;
}

function updateViewer() {

}

/* =================================================================
   PARTICLES
   ================================================================= */
function spawnParticles(x, y, count) {
  if (prefersReducedMotion) return;
  count = count || 10;
  var emojis = ['\u2728', '\u2B50', '\uD83D\uDCAB', '\uD83C\uDF1F', '\uD83D\uDC8E'];
  var fc = Math.min(count, 8);

  for (var i = 0; i < fc; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    var a = (Math.PI * 2 * i) / fc;
    var d = 60 + Math.random() * 50;
    p.style.setProperty('--tx', Math.cos(a) * d + 'px');
    p.style.setProperty('--ty', Math.sin(a) * d + 'px');
    p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(p);
    setTimeout(function(el) { return function() { el.remove(); }; }(p), 800);
  }
}

/* =================================================================
   FLIP ANIMATION
   ================================================================= */
function capturePositions() {
  previousNotePositions.clear();
  notesListDiv.querySelectorAll('.note-item').forEach(function(el) {
    var id = el.dataset.id;
    if (id) previousNotePositions.set(id, el.getBoundingClientRect());
  });
}

function applyFlip() {
  var dur = 280;
  notesListDiv.querySelectorAll('.note-item').forEach(function(el) {
    var id = el.dataset.id;
    var first = previousNotePositions.get(id);

    if (!first) {
      el.classList.add('fade-in');
      setTimeout(function() { el.classList.remove('fade-in'); }, 300);
      return;
    }

    var last = el.getBoundingClientRect();
    var dx = first.left - last.left;
    var dy = first.top - last.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

    el.classList.add('flipping');
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    el.style.transition = 'none';
    requestAnimationFrame(function() {
      el.style.transition = 'transform ' + dur + 'ms cubic-bezier(.16,1,.3,1)';
      el.style.transform = '';
      setTimeout(function() {
        el.classList.remove('flipping');
        el.style.transition = '';
      }, dur);
    });
  });
}

   NOTES LIST

function renderList(animate) {
  if (animate === undefined) animate = true;
  if (animate) capturePositions();

  if (!currentUser) {
    notesListDiv.innerHTML =

        '<div>' + t('signIn') + '</div>' +
      '</div>';
    notesCountEl.textContent = '0';
    return;
  }

  var items = Object.entries(notes.notes).sort(function(a, b) {
    return (b[1].updatedAt || 0) - (a[1].updatedAt || 0);
  });
  var total = items.length;
  notesCountEl.textContent = total;

  if (searchQuery.trim()) {
    var q = searchQuery.toLowerCase();
    items = items.filter(function(entry) {
      var n = entry[1];
      var ti = (n.title || '').toLowerCase();
      var bo = (n.body || '').toLowerCase();
      return ti.includes(q) || bo.includes(q);
    });
  }

  if (total === 0) {
    notesListDiv.innerHTML =
      '<div class="empty-state">' +
        '<span class="emoji" aria-hidden="true">\uD83D\uDCEC</span>' +
        '<div>' + t('noNotes') + '</div>' +
        '<div style="font-size:11px;margin-top:4px;opacity:.7">' + t('createFirst') + '</div>' +
      '</div>';
    return;
  }

  if (items.length === 0) {
    notesListDiv.innerHTML =
      '<div class="empty-state">' +
        '<span class="emoji" aria-hidden="true">\uD83D\uDD0D</span>' +
        '<div>' + t('noResults') + '</div>' +
      '</div>';
    return;
  }

  notesListDiv.innerHTML = items.map(function(entry) {
    var id = entry[0];
    var n = entry[1];
    var pv = (n.body || '').replace(/[#*_\-`]/g, '').substring(0, 80);
    var isActive = currentId == id ? ' active' : '';
    return '<div class="note-item' + isActive + '" data-id="' + id + '" role="option" aria-selected="' + (isActive ? 'true' : 'false') + '">' +
      '<div class="note-title">' + escapeHtml(n.title || t('untitled')).substring(0, 40) + '</div>' +
      '<div class="note-preview">' + (escapeHtml(pv) || t('emptyNote')) + '</div>' +
      '<div class="note-date">' + (n.updatedAt ? formatRelative(n.updatedAt) : t('justNow')) + '</div>' +
    '</div>';
  }).join('');

  notesListDiv.querySelectorAll('.note-item').forEach(function(el) {
    el.addEventListener('click', function() {
      currentId = el.dataset.id;
      loadNoteToEditor(currentId);
      renderList(false);
    });
  });

  if (animate) applyFlip();
}

function formatRelative(ts) {
  var diff = Date.now() - ts;
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return t('justNow');
  if (mins < 60) return mins + t('mAgo');
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + t('hAgo');
  var days = Math.floor(hrs / 24);
  if (days < 7) return days + t('dAgo');
  return new Date(ts).toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US');
}

function loadNoteToEditor(id) {
  cancelAutoSave();
  var n = notes.notes[id];
  if (!n) return;
  titleInp.value = n.title || '';
  bodyTextarea.value = n.body || '';
  if (isViewMode) updateViewer();
  setStatus(t('loaded'), 'saved', 1200);
}

/* =================================================================
   SAVE / DELETE / NEW
   ================================================================= */
async function saveCurrent(isAuto) {
  cancelAutoSave();
  if (!currentUser) {
    showMsg(t('signInFirst'), 'error');
    return;
  }

  var title = titleInp.value.trim();
  var body = bodyTextarea.value;

  if (!title && !body) {
    setStatus(t('emptyNote'), 'error', 2000);
    isDirty = false;
    return;
  }

  setStatus(t('saving'), 'saving', 0);
  var id = currentId;
  var isNew = !id || !notes.notes[id];

  if (isNew) {
    id = String(notes.nextId++);
    notes.notes[id] = {
      title: title || t('newNote'),
      body: body,
      tags: [],
      pinned: false,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
  } else {
    notes.notes[id].title = title || t('untitled');
    notes.notes[id].body = body;
    notes.notes[id].updatedAt = Date.now();
  }

  currentId = id;
  await saveCollection(currentUser, currentPass, { notes: notes.notes, nextId: notes.nextId });
  isDirty = false;

  if (!isAuto) {
    var rc = saveBtn.getBoundingClientRect();
    spawnParticles(rc.left + rc.width / 2, rc.top + rc.height / 2, 8);
    showMsg('\u2728 ' + t('noteSaved'), 'success');
  }

  setStatus('\u2713 ' + t('saved'), 'saved', 2000);
  renderList(isNew);
  if (isViewMode) updateViewer();
}

async function deleteCurrent() {
  if (!currentId || !notes.notes[currentId]) return;
  var ok = await showDialog(t('deleteTitle'), t('deleteMessage'));
  if (!ok) return;

  delete notes.notes[currentId];
  var ids = Object.keys(notes.notes);
  currentId = ids.length ? ids[0] : null;
  await saveCollection(currentUser, currentPass, { notes: notes.notes, nextId: notes.nextId });

  if (currentId) loadNoteToEditor(currentId);
  else {
    titleInp.value = '';
    bodyTextarea.value = '';
    viewerDiv.innerHTML = '';
  }

  renderList(true);
  setStatus(t('deleted'), 'error', 2000);
  showMsg('\uD83D\uDDD1 ' + t('noteRemoved'), 'info');
}

async function newNote() {
  if (!currentUser) {
    showMsg(t('signInFirst'), 'error');
    return;
  }
  currentId = null;
  titleInp.value = '';
  bodyTextarea.value = '';
  if (isViewMode) updateViewer();
  setStatus(t('newNote'), 'saved', 1500);
  renderList(false);
  titleInp.focus();
}

async function login() {
  var uid = userIdInp.value.trim();
  var pwd = passInp.value;
  if (!uid || !pwd) {
    showMsg(t('enterIdPass'), 'error');
    return;
  }

  setStatus(t('saving'), 'saving', 0);
  var orig = loginBtn.textContent;
  loginBtn.innerHTML = '<span class="loading-ring"></span>';
  loginBtn.disabled = true;

  try {
    var data = await loadCollection(uid, pwd);
    currentUser = uid;
    currentPass = pwd;
    notes = data;
    if (!notes.notes) notes.notes = {};
    if (!notes.nextId) notes.nextId = 1;

    authBadge.innerHTML = '<span class="dot"></span><span>' + uid + '</span>';
    authBadge.classList.add('active');

    logoutBtn.hidden = false;
    exportBtn.hidden = false;
    importBtn.hidden = false;

    var ids = Object.keys(notes.notes);
    currentId = ids.length ? ids[0] : null;
    if (currentId) loadNoteToEditor(currentId);
    renderList(false);

    showMsg('\uD83D\uDD13 ' + t('vaultUnlocked') + ' \u00B7 ' + ids.length + ' ' + t('notes'), 'success');
    setStatus(t('ready'), 'saved', 2000);

    var logo = document.querySelector('.logo-icon');
    var rc = logo.getBoundingClientRect();
    spawnParticles(rc.left + rc.width / 2, rc.top + rc.height / 2, 12);
  } catch (e) {

    setStatus(t('authFailed'), 'error', 3000);
    currentUser = null;
    currentPass = null;
    authBadge.innerHTML = '<span class="dot"></span><span>' + t('locked') + '</span>';
    authBadge.classList.remove('active');
    logoutBtn.hidden = true;
    exportBtn.hidden = true;
    importBtn.hidden = true;
    renderList(false);
  } finally {
    loginBtn.textContent = orig;
    loginBtn.disabled = false;
  }
}

function logout() {
  cancelAutoSave();
  currentUser = null;
  currentPass = null;
  notes = { notes: {}, nextId: 1 };
  currentId = null;
  userIdInp.value = '';
  passInp.value = '';

}

/* =================================================================
   EXPORT / IMPORT
   ================================================================= */
async function exportBackup() {
  if (!currentUser) {
    showMsg(t('signInFirst'), 'error');
    return;
  }

  try {
    var data = await loadCollection(currentUser, currentPass);
    var backup = {
      version: 'md_notes_v2',
      userId: currentUser,
      encryptedData: await encryptData(data, currentPass),
      exportedAt: Date.now()
    };
    var jsonStr = JSON.stringify(backup, null, 2);

    if (IS_TAURI) {
      var dialog = window.__TAURI__.dialog;
      var fs = window.__TAURI__.fs;
      var filePath = await dialog.save({
        title: t('exportBackup'),
        defaultPath: 'md_notes_' + currentUser + '_' + Date.now() + '.backup.json',
        filters: [{ name: 'JSON Backup', extensions: ['json'] }]
      });
      if (filePath) {
        await fs.writeTextFile(filePath, jsonStr);
        showMsg('\u2705 ' + t('backupDownloaded'), 'success');
      }
    } else {
      var blob = new Blob([jsonStr], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'md_notes_' + currentUser + '_' + Date.now() + '.backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      showMsg('\u2705 ' + t('backupDownloaded'), 'success');
    }
  } catch (e) {
    console.error('Export error:', e);
    showMsg(t('exportFailed') + ': ' + e.message, 'error');
  }
}

async function importBackup(file) {
  if (!file || !currentUser) {
    showMsg(t('signInFirst'), 'error');
    return;
  }

  try {
    var text = await file.text();
    var imported = JSON.parse(text);
    if (imported.userId !== currentUser) throw new Error('Wrong user');
    var dec = await decryptData(imported.encryptedData, currentPass);
    notes = migrateData(dec);
    if (!notes.notes) notes.notes = {};
    if (!notes.nextId) notes.nextId = 1;
    await saveCollection(currentUser, currentPass, notes);
    var ids = Object.keys(notes.notes);
    currentId = ids.length ? ids[0] : null;
    if (currentId) loadNoteToEditor(currentId);
    renderList(true);
    showMsg('Imported ' + ids.length + ' ' + t('notes'), 'success');
  } catch (e) {
    showMsg(t('importFailed') + ': ' + e.message, 'error');
  }
}

function openPalette() {
  if (paletteOpen) return;

  paletteSelectedIndex = 0;

  var ov = document.createElement('div');
  ov.id = 'cmdOverlay';
  ov.className = 'cmd-overlay';
  ov.innerHTML =
    '<div class="cmd-palette" role="dialog" aria-label="Command Palette">' +
      '<div class="cmd-input-wrap">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
          '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' +
        '</svg>' +
        '<input type="text" class="cmd-input" id="cmdInput" placeholder="' + t('searchPlaceholder') + '" autocomplete="off" spellcheck="false" aria-label="Поиск">' +
        '<span class="cmd-shortcut-hint">ESC</span>' +
      '</div>' +
      '<div class="cmd-results" id="cmdResults" role="listbox"></div>' +
      '<div class="cmd-footer">' +

        '<span class="cmd-footer-hint"><kbd>esc</kbd> ' + t('close') + '</span>' +
      '</div>' +
    '</div>';

  document.body.appendChild(ov);
  var inp = document.getElementById('cmdInput');
  inp.focus();
  inp.addEventListener('input', handlePaletteInput);
  ov.addEventListener('click', function(e) { if (e.target === ov) closePalette(); });
  filterPalette('');
}

function handlePaletteInput(e) {
  clearTimeout(paletteSearchTimeout);
  paletteSearchTimeout = setTimeout(function() {
    filterPalette(e.target.value);
  }, 80);
}

function filterPalette(query) {
  var q = query.toLowerCase().trim();
  paletteFiltered = [];

  var mc = commands.filter(function(c) {
    var ti = c.title().toLowerCase();
    return ti.includes(q) || c.keywords.some(function(k) { return k.includes(q); });
  }).map(function(c) {
    return { type: 'command', data: c };
  });

  var mn = [];
  if (currentUser && notes.notes) {
    mn = Object.entries(notes.notes).filter(function(entry) {
      var n = entry[1];
      var ti = (n.title || '').toLowerCase();
      var bo = (n.body || '').toLowerCase();
      return ti.includes(q) || bo.includes(q);
    }).slice(0, 6).map(function(entry) {
      return { type: 'note', data: { id: entry[0], note: entry[1] } };
    });
  }

  paletteFiltered = mc.concat(mn);
  paletteSelectedIndex = Math.min(paletteSelectedIndex, Math.max(0, paletteFiltered.length - 1));
  renderPalette();
}

function renderPalette() {
  var ct = document.getElementById('cmdResults');
  if (!ct) return;

  if (!paletteFiltered.length) {
    ct.innerHTML = '<div class="cmd-empty">\uD83D\uDD0E ' + t('noResults') + '</div>';
    return;
  }

  var html = '';
  var curType = '';

  paletteFiltered.forEach(function(item, i) {
    if (item.type !== curType) {
      curType = item.type;
      html += '<div class="cmd-group-label">' + (item.type === 'command' ? t('commands') : t('notesLabel')) + '</div>';
    }

    if (item.type === 'command') {
      var cmd = item.data;
      var sc = cmd.shortcut ? formatShortcut(cmd.shortcut) : '';
      html += '<div class="cmd-item' + (i === paletteSelectedIndex ? ' active' : '') + '" data-idx="' + i + '" role="option">' +
        '<div class="cmd-item-icon">' + cmd.icon + '</div>' +
        '<div class="cmd-item-text"><div class="cmd-item-title">' + cmd.title() + '</div></div>' +
        (sc ? '<kbd>' + sc + '</kbd>' : '') +
      '</div>';
    } else {
      var note = item.data.note;
      html += '<div class="cmd-item' + (i === paletteSelectedIndex ? ' active' : '') + '" data-idx="' + i + '" role="option">' +
        '<div class="cmd-item-icon">\uD83D\uDCDD</div>' +
        '<div class="cmd-item-text">' +
          '<div class="cmd-item-title">' + escapeHtml(note.title || t('untitled')).substring(0, 50) + '</div>' +
          '<div class="cmd-item-subtitle">' + escapeHtml((note.body || '').substring(0, 60)) + '</div>' +
        '</div>' +
      '</div>';
    }
  });

  ct.innerHTML = html;

  ct.querySelectorAll('.cmd-item').forEach(function(el) {
    el.addEventListener('click', function() {
      executePaletteItem(parseInt(el.dataset.idx));
    });
  });

  var act = ct.querySelector('.cmd-item.active');
  if (act) act.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function executePaletteItem(idx) {
  var item = paletteFiltered[idx];
  if (!item) return;
  closePalette();

  if (item.type === 'command') {
    item.data.action();
  } else {
    currentId = item.data.id;
    loadNoteToEditor(currentId);
    renderList(false);
  }
}

function closePalette() {
  if (!paletteOpen) return;
  paletteOpen = false;
  var ov = document.getElementById('cmdOverlay');
  if (ov) {
    ov.style.opacity = '0';
    ov.style.transition = 'opacity .12s ease';
    setTimeout(function() { ov.remove(); }, 120);
  }
}

      '<div class="help-section">' +
        '<div class="help-section-title">' + t('editor') + '</div>' +
        '<div class="help-row"><span class="help-row-label">' + t('newNoteDesc') + '</span><div class="help-row-keys">' + kbd(['mod','shift','n']) + '</div></div>' +
        '<div class="help-row"><span class="help-row-label">' + t('saveNote') + '</span><div class="help-row-keys">' + kbd(['mod','s']) + '</div></div>' +
        '<div class="help-row"><span class="help-row-label">' + t('deleteNote') + '</span><div class="help-row-keys">' + kbd(['mod','d']) + '</div></div>' +
      '</div>' +
      '<div class="help-section">' +
        '<div class="help-section-title">' + t('navigation') + '</div>' +
        '<div class="help-row"><span class="help-row-label">' + t('nextNote') + '</span><div class="help-row-keys">' + kbd(['J']) + '</div></div>' +
        '<div class="help-row"><span class="help-row-label">' + t('prevNote') + '</span><div class="help-row-keys">' + kbd(['K']) + '</div></div>' +
        '<div class="help-row"><span class="help-row-label">' + t('close') + '</span><div class="help-row-keys">' + kbd(['Esc']) + '</div></div>' +
      '</div>' +
    '</div>';

  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) closeHelp(); });
}

function closeHelp() {
  helpOpen = false;
  var ov = document.getElementById('helpOverlay');
  if (ov) ov.remove();
}

/* =================================================================
   KEYBOARD SHORTCUTS
   ================================================================= */
function isInputFocused() {
  var el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
}

function navigateNotes(dir) {
  if (!currentUser || !notes.notes) return;
  var ids = Object.entries(notes.notes)
    .sort(function(a, b) { return (b[1].updatedAt || 0) - (a[1].updatedAt || 0); })
    .map(function(e) { return e[0]; });
  if (!ids.length) return;

  var ci = currentId ? ids.indexOf(currentId) : -1;
  var ni = ci === -1 ? (dir > 0 ? 0 : ids.length - 1) : (ci + dir + ids.length) % ids.length;
  currentId = ids[ni];
  loadNoteToEditor(currentId);
  renderList(false);
  showKeyToast(dir > 0 ? '\u2193' : '\u2191');
}

function showKeyToast(key) {
  var ex = document.querySelector('.key-toast');
  if (ex) ex.remove();
  var toast = document.createElement('div');
  toast.className = 'key-toast';
  toast.textContent = '\u2328 ' + key;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 1200);
}

document.addEventListener('keydown', function(e) {
  var mod = isMod(e);
  var key = e.key.toLowerCase();

  if (mod && !e.shiftKey && key === 'k') {
    e.preventDefault();
    paletteOpen ? closePalette() : openPalette();
    showKeyToast(formatShortcut('mod+k'));
    return;
  }

  if (mod && !e.shiftKey && key === 's') {
    e.preventDefault();
    saveCurrent(false);
    showKeyToast(formatShortcut('mod+s'));
    return;
  }

  if (mod && e.shiftKey && key === 'n') {
    e.preventDefault();
    newNote();
    showKeyToast(formatShortcut('mod+shift+n'));
    return;
  }

  if (mod && e.shiftKey && key === 'l') {
    e.preventDefault();
    langBtn.click();
    showKeyToast(formatShortcut('mod+shift+l'));
    return;
  }

  if (mod && !e.shiftKey && key === 'e') {
    e.preventDefault();
    exportBackup();
    showKeyToast(formatShortcut('mod+e'));
    return;
  }

  if (mod && !e.shiftKey && key === 'd') {
    e.preventDefault();
    deleteCurrent();
    return;
  }

  if (e.key === 'Escape') {
    if (paletteOpen) { closePalette(); e.preventDefault(); return; }
    if (helpOpen) { closeHelp(); e.preventDefault(); return; }
    if (dialogOverlay.classList.contains('show')) {
      dialogOverlay.classList.remove('show');
      if (dialogResolver) dialogResolver(false);
      e.preventDefault();
      return;
    }
    emojiPicker.classList.remove('show');
    return;
  }

  if (paletteOpen) {
    if (e.key === 'ArrowDown') {
      paletteSelectedIndex = (paletteSelectedIndex + 1) % paletteFiltered.length;
      renderPalette();
      e.preventDefault();
      return;
    }
    if (e.key === 'ArrowUp') {
      paletteSelectedIndex = (paletteSelectedIndex - 1 + paletteFiltered.length) % paletteFiltered.length;
      renderPalette();
      e.preventDefault();
      return;
    }
    if (e.key === 'Enter') {
      executePaletteItem(paletteSelectedIndex);
      e.preventDefault();
      return;
    }
    return;
  }

  if ((e.key === '?' || (e.shiftKey && e.key === '/')) && !isInputFocused()) {
    e.preventDefault();
    helpOpen ? closeHelp() : openHelp();
    return;
  }

  if (isInputFocused()) return;

  if (key === 'j') { navigateNotes(1); e.preventDefault(); return; }
  if (key === 'k') { navigateNotes(-1); e.preventDefault(); return; }
  if (key === '/') { e.preventDefault(); openPalette(); return; }
});

/* =================================================================
   SEARCH
   ================================================================= */
var searchDebounce = null;

searchInput.addEventListener('input', function(e) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(function() {
    searchQuery = e.target.value;
    renderList(false);
  }, 150);
});

/* =================================================================
   EVENT BINDINGS
   ================================================================= */
loginBtn.onclick = login;
logoutBtn.onclick = logout;
exportBtn.onclick = exportBackup;
importBtn.onclick = function() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function(e) { importBackup(e.target.files[0]); };
  inp.click();
};
newNoteBtn.onclick = newNote;
saveBtn.onclick = function() { saveCurrent(false); };
deleteBtn.onclick = deleteCurrent;
emojiBtn.onclick = showPicker;
modeBtn.onclick = toggleMode;
titleInp.addEventListener('input', scheduleAutoSave);
bodyTextarea.addEventListener('input', scheduleAutoSave);

langBtn.onclick = function() {
  var nl = currentLang === 'ru' ? 'en' : 'ru';
  applyLanguage(nl);
  showMsg(nl === 'ru' ? 'RU' : 'EN', 'info');
};

passInp.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
userIdInp.addEventListener('keydown', function(e) { if (e.key === 'Enter') passInp.focus(); });

/* =================================================================
   INITIALIZATION
   ================================================================= */
bodyTextarea.style.display = 'block';
viewerDiv.style.display = 'none';
isViewMode = false;
modeBtn.textContent = t('edit');
applyLanguage(currentLang);
updateAllHints();
setStatus(t('ready'));
renderList(false);
</script>
