:root{--radius:4px;--ease:cubic-bezier(.16,1,.3,1);--fs:'Playfair Display','Georgia',serif;--fn:'Inter',-apple-system,system-ui,sans-serif;--fm:'JetBrains Mono','Consolas',monospace}
html,body{height:100%;overflow:hidden;font-family:var(--fn);color:var(--tx-800);-webkit-font-smoothing:antialiased;background:var(--bg-body);background-image:var(--body-bg)}
.app{height:100vh;display:flex;flex-direction:column}
.navbar{background:var(--bg-nav);border-bottom:2px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:7px}
.logo-icon{width:36px;height:36px;border-radius:var(--radius);overflow:hidden;background:var(--bg-card2);border:1px solid var(--border2)}
.logo h1{font-size:14px;font-weight:700;font-family:var(--fs);color:var(--tx-100);line-height:1}
.logo p{font-size:7.5px;font-family:var(--fm);color:var(--tx-400);letter-spacing:.06em;text-transform:uppercase}
.auth{display:flex;gap:3px;align-items:center;padding:3px;border-radius:var(--radius);background:rgba(0,0,0,.15);border:1px solid var(--border3)}
.auth input{background:var(--bg-input);border:1px solid var(--border2);border-radius:var(--radius);padding:4px 7px;font-size:10.5px;font-family:inherit;color:var(--paper-m);width:105px}
.auth input:focus{border-color:var(--accent);outline:none}
.nav-spacer{flex:1}
.btn{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--radius);font-size:10.5px;font-weight:500;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:all .12s}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent-d);font-weight:600}
.btn-primary:hover{background:var(--accent-l)}
.btn-ghost{background:var(--bg-surface);color:var(--tx-200);border-color:var(--border2)}
.lang-btn{display:inline-flex;align-items:center;gap:2px;padding:2px 5px;border-radius:var(--radius);background:var(--paper-m);border:1px solid var(--paper-e);color:var(--tx-600);font-size:8px;font-weight:600;font-family:var(--fm);cursor:pointer;margin-left:4px}
.lang-btn:hover{background:var(--paper-e);color:var(--tx-800)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:100px;font-size:9px;font-weight:500;font-family:var(--fm);background:rgba(0,0,0,.15);border:1px solid var(--border2);color:var(--tx-400)}
.badge.active{background:var(--accent-g);border-color:var(--accent);color:var(--accent-l)}
.badge .dot{width:4px;height:4px;border-radius:50%;background:var(--tx-500)}
.badge.active .dot{background:var(--accent)}
.theme-btn{position:relative;display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:var(--radius);background:var(--bg-surface);border:1px solid var(--border2);color:var(--tx-200);cursor:pointer;z-index:1001}
.theme-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0}
.theme-menu{position:fixed;top:48px;right:16px;background:var(--bg-card);border:2px solid var(--border2);border-radius:var(--radius);padding:6px;z-index:1000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.theme-menu.show{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:60vh;overflow-y:auto}
.theme-opt{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid var(--tx-600);background:none;padding:0;display:grid;place-items:center;transition:all .15s}
.theme-opt:hover{transform:scale(1.15)}
.theme-opt.active{transform:scale(1.35);box-shadow:0 0 0 2px var(--bg-card),0 0 8px rgba(0,0,0,.3)}
.theme-opt .theme-dot{width:12px;height:12px;border:none;border-radius:50%}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:295px;background:var(--bg-side);display:flex;flex-direction:column;overflow:hidden;border-right:2px solid var(--border)}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border2);background:var(--bg-side-hd)}
.sidebar-tab{flex:1;padding:6px;font-size:9.5px;font-weight:600;color:var(--tx-400);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:none;background:none;font-family:var(--fm);border-bottom:2px solid transparent;text-align:center}
.sidebar-tab:hover{color:var(--tx-200)}
.sidebar-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sidebar-hd{padding:8px 10px 6px;border-bottom:1px solid var(--border2);background:var(--bg-side-hd)}
.search-box{position:relative;margin-bottom:5px}
.search-box input{width:100%;background:var(--bg-input);border:1px solid var(--border2);border-radius:var(--radius);padding:5px 8px 5px 26px;font-size:10.5px;font-family:inherit;color:var(--paper-m)}
.search-box input::placeholder{color:var(--tx-500)}
.search-box input:focus{border-color:var(--accent);outline:none}
.search-icon{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:11px;height:11px;color:var(--tx-500);pointer-events:none}
.msg-area{min-height:20px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:500;padding:3px 6px;border-radius:var(--radius);margin-bottom:3px;opacity:0;transition:opacity .2s}
.msg-area.show{opacity:1}
.msg-area.success{background:var(--accent-g);border:1px solid rgba(61,107,34,.2);color:var(--accent-l)}
.msg-area.error{background:rgba(139,37,40,.1);border:1px solid rgba(139,37,40,.15);color:var(--crimson-l)}
.msg-area.info{background:var(--accent-g);border:1px solid rgba(61,107,34,.15);color:var(--accent)}
.notes-hd{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.notes-hd h3{font-size:9px;font-weight:600;color:var(--tx-400);text-transform:uppercase;letter-spacing:.07em;font-family:var(--fm)}
.notes-ct{font-family:var(--fm);font-size:8.5px;color:var(--tx-500);padding:1px 5px;background:rgba(0,0,0,.12);border:1px solid var(--border2);border-radius:100px}
.new-btn{width:22px;height:22px;border-radius:var(--radius);background:var(--accent);display:grid;place-items:center;cursor:pointer;border:1px solid var(--accent-d)}
.new-btn::after{content:'+';color:#fff;font-size:13px;font-weight:300}
.new-btn:hover{background:var(--accent-l)}
.notes-list{flex:1;overflow-y:auto;padding:4px 5px 10px}
.notes-list::-webkit-scrollbar{width:3px}
.notes-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.note-item{position:relative;background:var(--bg-card);border:1px solid var(--border3);border-radius:var(--radius);padding:8px 8px 6px 10px;margin-bottom:3px;cursor:pointer;transition:all .12s}
.note-item::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);border-radius:0 2px 2px 0;opacity:0;transition:opacity .12s}
.note-item:hover{background:var(--bg-card2);border-color:var(--border2)}
.note-item:hover::before{opacity:.35}
.note-item.active{background:var(--bg-card2);border-color:var(--accent)}
.note-item.active::before{opacity:1}
.note-item.fade-in{animation:fi .18s var(--ease)}@keyframes fi{from{opacity:0;transform:translateX(-3px)}to{opacity:1}}
.note-title{font-size:11px;font-weight:600;color:var(--paper-m);margin-bottom:1px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:20px}
.note-pv{font-size:9.5px;color:var(--tx-400);line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-dt{font-size:8px;color:var(--tx-500);font-family:var(--fm)}
.note-actions{position:absolute;top:5px;right:5px;opacity:0;transition:opacity .12s}
.note-item:hover .note-actions{opacity:1}
.note-act{width:18px;height:18px;border-radius:3px;border:none;cursor:pointer;display:grid;place-items:center;font-size:9px;background:transparent;color:var(--tx-400)}
.note-act:hover{background:var(--bg-surface);color:var(--tx-200)}
.note-act.pin-btn{position:absolute;top:5px;right:5px;color:var(--crimson);opacity:0;transition:opacity .12s}
.note-item:hover .note-act.pin-btn{opacity:1}
.note-item .note-act.pin-btn.pinned{opacity:1}
.note-act.pin-btn.pinned{color:var(--crimson-l);background:rgba(139,37,40,.12)}
.note-act.del-btn{position:absolute;bottom:5px;right:5px;color:var(--tx-500);opacity:0;transition:opacity .12s}
.note-item:hover .note-act.del-btn{opacity:1}
.note-act.del-btn:hover{color:var(--crimson-l);background:rgba(139,37,40,.15);transform:scale(1.15)}
.note-act.restore-btn{position:absolute;bottom:5px;right:23px;color:var(--tx-500);opacity:0;transition:opacity .12s;font-size:11px}
.note-item:hover .note-act.restore-btn{opacity:1}
.note-act.restore-btn:hover{color:var(--accent-l);background:var(--accent-g);transform:scale(1.15)}
.empty-state{padding:24px 12px;text-align:center;color:var(--tx-400);font-size:10.5px}
.empty-state .emoji{font-size:24px;margin-bottom:6px;display:block;opacity:.25}
.trash-actions{padding:6px 10px;border-bottom:1px solid var(--border2);display:none}
.btn-empty{background:rgba(139,37,40,.1);border:1px solid rgba(139,37,40,.2);color:var(--crimson-l);padding:4px 8px;border-radius:var(--radius);font-size:9.5px;cursor:pointer;font-family:inherit}
.editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.editor-toolbar{padding:6px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid var(--paper-e);z-index:2;flex-shrink:0;background:var(--paper-w);background-image:var(--paper-svg),var(--paper-fiber)}
.title-input{font-size:18px;font-weight:700;font-family:var(--fs);background:transparent;border:none;color:var(--tx-900);flex:1;outline:none;caret-color:var(--accent);min-width:0}
.title-input::placeholder{color:var(--tx-200);font-weight:600}
.action-buttons{display:flex;gap:3px;flex-shrink:0;align-items:center}
.icon-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 7px;border-radius:var(--radius);font-size:10px;font-weight:500;font-family:inherit;cursor:pointer;border:1px solid var(--paper-e);background:var(--paper);color:var(--tx-600);transition:all .12s}
.icon-btn:hover{background:var(--paper-m);border-color:var(--paper-d);color:var(--tx-800)}
.icon-btn.mode{background:var(--paper-m);border-color:var(--paper-e);font-family:var(--fm);font-size:9px}
.icon-btn.save{background:var(--accent);border-color:var(--accent-d);color:#fff;font-weight:600}
.icon-btn.save:hover{background:var(--accent-l)}
.content-container{flex:1;position:relative;overflow:hidden;min-height:0}
textarea,.viewer{position:absolute;inset:0;padding:18px 30px 50px;font-size:13px;line-height:1.75;background:transparent;border:none;outline:none;color:var(--tx-700);overflow-y:auto;font-family:var(--fn);resize:none;caret-color:var(--accent);z-index:1}
.content-container::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:var(--paper);background-image:var(--paper-svg),var(--paper-fiber),var(--paper-fiber2)}
textarea::placeholder{color:var(--tx-200)}
textarea::-webkit-scrollbar,.viewer::-webkit-scrollbar{width:5px}
textarea::-webkit-scrollbar-thumb,.viewer::-webkit-scrollbar-thumb{background:var(--paper-e);border-radius:3px}
.viewer{font-family:var(--fn);line-height:1.75;color:var(--tx-700)}
.viewer>:first-child{margin-top:0}
.viewer h1{font-family:var(--fs);font-size:24px;font-weight:700;margin:24px 0 10px;padding-bottom:8px;color:var(--tx-900);border-bottom:2px solid var(--paper-e);line-height:1.2}
.viewer h1:first-child{margin-top:0}
.viewer h2{font-family:var(--fs);font-size:19px;font-weight:600;margin:20px 0 8px;padding-bottom:6px;color:var(--tx-900);border-bottom:1px solid var(--paper-e)}
.viewer h3{font-family:var(--fs);font-size:16px;font-weight:600;margin:16px 0 6px;color:var(--tx-800)}
.viewer p{margin:7px 0}
.viewer strong{color:var(--tx-900);font-weight:700}
.viewer em{color:var(--tx-600)}
.viewer del{text-decoration:line-through;color:var(--tx-400)}
.viewer code{font-family:var(--fm);font-size:.86em;background:rgba(60,38,18,.06);border:1px solid rgba(60,38,18,.1);border-radius:3px;padding:1px 4px;color:var(--crimson)}
.viewer pre{margin:10px 0;background:var(--bg-pre);border:1px solid var(--border2);border-radius:var(--radius);padding:0;overflow:auto;max-width:100%}
.viewer pre .code-wrap{display:flex;padding:12px 0;min-width:max-content}
.viewer pre .line-nums{display:flex;flex-direction:column;padding:8px 12px 8px 0;border-right:1px solid var(--border2);user-select:none;flex-shrink:0;min-width:40px;text-align:right;background:rgba(0,0,0,.15)}
.viewer pre .line-nums span{font-family:var(--fm);font-size:11px;line-height:1.65;color:var(--tx-400);text-align:right;padding:0 4px;min-width:24px;border-right:1px solid rgba(255,255,255,.05)}
.viewer pre .line-nums span:hover{color:var(--tx-200);background:rgba(255,255,255,.03);border-radius:2px}
.viewer pre .code-content{flex:1;padding:8px 16px;overflow-x:auto}
.viewer pre code{background:transparent;border:none;padding:0;color:#D4C0A0;font-size:12px;line-height:1.65;display:block;white-space:pre;tab-size:4}
.viewer blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--accent-g);color:var(--tx-600);border-radius:0 var(--radius) var(--radius) 0}
.viewer blockquote p{margin:3px 0}
.viewer ul,.viewer ol{margin:7px 0;padding-left:22px}
.viewer li{margin:2px 0;line-height:1.6}
.viewer ul li::marker{color:var(--accent);font-size:7px}
.viewer .task-list{list-style:none;padding-left:3px}
.viewer .task-list li{display:flex;align-items:flex-start;gap:6px;padding-left:0}
.viewer .task-list input[type="checkbox"]{appearance:none;width:14px;height:14px;border:1.5px solid var(--paper-d);border-radius:3px;background:var(--paper);flex-shrink:0;margin-top:3px;position:relative}
.viewer .task-list input:checked{background:var(--accent);border-color:var(--accent-d)}
.viewer .task-list input:checked::after{content:'';position:absolute;left:3px;top:.5px;width:5px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.viewer .task-list li.checked{color:var(--tx-400);text-decoration:line-through}
.viewer a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(42,80,144,.2)}
.viewer a:hover{color:var(--blue-l)}
.viewer img{max-width:100%;border-radius:var(--radius);border:1px solid var(--paper-e);margin:8px 0;cursor:nwse-resize;display:block}
.viewer img.resize-active{outline:2px solid var(--accent);outline-offset:2px}
.viewer hr{border:none;height:2px;background:linear-gradient(90deg,transparent,var(--paper-e),transparent);margin:18px 0}
.viewer table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.viewer th{background:rgba(60,38,18,.05);border:1px solid var(--paper-e);padding:5px 10px;font-weight:600;text-align:left;color:var(--tx-800);font-size:11px}
.viewer td{border:1px solid var(--paper-e);padding:5px 10px;color:var(--tx-700)}
.viewer mark{background:rgba(184,146,44,.3);color:inherit;border-radius:2px;padding:0 1px}
.bottom-status{padding:4px 18px;font-size:8.5px;font-family:var(--fm);color:var(--tx-400);border-top:1px solid var(--paper-e);background:var(--paper-w);background-image:var(--paper-svg);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.status-left,.status-right{display:flex;align-items:center;gap:6px}
.bottom-status .status-dot{width:4px;height:4px;border-radius:50%;background:var(--paper-e)}
.bottom-status.saving .status-dot{background:var(--gold)}
.bottom-status.saved .status-dot{background:var(--accent)}
.bottom-status.error .status-dot{background:var(--crimson)}
.word-ct{color:var(--tx-500);font-family:var(--fm)}
.shortcut-hint{display:inline-flex;gap:6px;color:var(--tx-300)}
.shortcut-hint span{display:inline-flex;align-items:center;gap:2px}
.shortcut-hint kbd{font-family:var(--fm);font-size:7.5px;padding:1px 3px;background:var(--paper-m);border:1px solid var(--paper-e);border-radius:2px;color:var(--tx-400)}
.emoji-picker{position:fixed;background:var(--paper);background-image:var(--paper-svg);border-radius:var(--radius);padding:6px;display:none;grid-template-columns:repeat(8,1fr);gap:1px;max-width:280px;z-index:1000;border:2px solid var(--paper-e);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.emoji-picker.show{display:grid}
.emoji-item{font-size:15px;cursor:pointer;text-align:center;padding:3px;border-radius:3px;aspect-ratio:1;display:grid;place-items:center}
.emoji-item:hover{background:var(--paper-m)}
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding-top:13vh}
.cmd-palette{background:var(--paper);background-image:var(--paper-svg);border:2px solid var(--paper-e);border-radius:var(--radius);width:480px;max-width:calc(100vw - 40px);max-height:66vh;box-shadow:0 14px 40px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.cmd-input-wrap{padding:9px 10px;border-bottom:2px solid var(--paper-e);display:flex;align-items:center;gap:6px}
.cmd-input-wrap svg{width:12px;height:12px;color:var(--tx-400);flex-shrink:0}
.cmd-input{flex:1;background:transparent;border:none;outline:none;color:var(--tx-800);font-size:12px;font-family:inherit;caret-color:var(--accent)}
.cmd-input::placeholder{color:var(--tx-300)}
.cmd-results{overflow-y:auto;padding:3px;flex:1;max-height:46vh}
.cmd-results::-webkit-scrollbar{width:3px}
.cmd-results::-webkit-scrollbar-thumb{background:var(--paper-e);border-radius:2px}
.cmd-group-label{font-size:8px;font-weight:600;color:var(--tx-400);text-transform:uppercase;letter-spacing:.07em;padding:4px 6px 1px;font-family:var(--fm)}
.cmd-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:3px;cursor:pointer;color:var(--tx-700)}
.cmd-item.active,.cmd-item:hover{background:var(--paper-m)}
.cmd-item-icon{width:18px;height:18px;display:grid;place-items:center;font-size:10px;background:var(--paper-w);border:1px solid var(--paper-e);border-radius:3px;flex-shrink:0}
.cmd-item-text{flex:1;min-width:0}
.cmd-item-title{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-item-subtitle{font-size:8.5px;color:var(--tx-400);margin-top:1px}
.cmd-item kbd{font-family:var(--fm);font-size:8px;padding:1px 3px;background:var(--paper-m);border:1px solid var(--paper-e);border-radius:2px;color:var(--tx-400)}
.cmd-footer{padding:4px 8px;border-top:1px solid var(--paper-e);display:flex;gap:10px;font-size:8.5px;color:var(--tx-400);font-family:var(--fm);background:var(--paper-w)}
.cmd-footer-hint{display:inline-flex;align-items:center;gap:2px}
.cmd-footer-hint kbd{padding:1px 3px;background:var(--paper-m);border:1px solid var(--paper-e);border-radius:2px;font-size:8px}
.cmd-empty{padding:20px 12px;text-align:center;color:var(--tx-400);font-size:10.5px}
.help-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1500;display:none;align-items:center;justify-content:center}
.help-overlay.show{display:flex}
.help-modal{background:var(--paper);background-image:var(--paper-svg);border:2px solid var(--paper-e);border-radius:var(--radius);padding:16px 18px;width:400px;max-width:calc(100vw - 40px);max-height:80vh;overflow-y:auto;box-shadow:0 12px 36px rgba(0,0,0,.3)}
.help-modal h4{font-size:13px;font-weight:700;font-family:var(--fs);margin-bottom:10px;color:var(--tx-900)}
.help-section{margin-bottom:10px}
.help-section-title{font-size:8.5px;font-weight:600;color:var(--tx-400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;font-family:var(--fm)}
.help-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:10.5px}
.help-row-label{color:var(--tx-700)}
.help-row-keys{display:inline-flex;gap:2px;align-items:center}
.help-row kbd{font-family:var(--fm);font-size:8.5px;padding:1px 3px;background:var(--paper-m);border:1px solid var(--paper-e);border-radius:2px;color:var(--tx-700)}
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:none;align-items:center;justify-content:center}
.dialog-overlay.show{display:flex}
.dialog{background:var(--paper);background-image:var(--paper-svg);border:2px solid var(--paper-e);border-radius:var(--radius);padding:16px;max-width:300px;width:calc(100% - 40px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dialog h4{font-size:13px;font-weight:700;font-family:var(--fs);margin-bottom:3px;color:var(--tx-900)}
.dialog p{font-size:11px;color:var(--tx-500);line-height:1.45;margin-bottom:12px}
.dialog-actions{display:flex;gap:4px;justify-content:flex-end}
.dialog-actions .btn{padding:4px 11px}
.btn-danger{background:var(--crimson);color:#fff;border-color:#6B1A1C}
.btn-danger:hover{background:var(--crimson-l)}
.loading-ring{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.key-toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--paper-m);padding:3px 7px;border-radius:3px;font-family:var(--fm);font-size:9px;border:1px solid var(--border2);box-shadow:0 3px 8px rgba(0,0,0,.2);animation:toast .9s ease forwards;pointer-events:none;z-index:3000}
@keyframes toast{0%{opacity:0;transform:translate(-50%,3px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-2px)}}
.drop-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--paper-m);font-family:var(--fs)}
.drop-overlay.show{display:flex}
@media(max-width:768px){.sidebar{width:210px}.navbar{padding:4px 6px;gap:3px;flex-wrap:wrap}.title-input{font-size:14px}textarea,.viewer{padding:12px 12px 36px;font-size:12px}.editor-toolbar{padding:5px 9px}.logo p{display:none}.shortcut-hint{display:none}}
</style>
</head>
